name: build
on:
  schedule:
    - cron: "00 17 * * 0" # rebuild weekly, Sundays at 5:00 PM UTC, to pick up upstream Kinoite/Brave updates
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build (all runs the full matrix)"
        required: false
        default: all
        type: choice
        options:
          - all
          - recipe.yml
          - recipe-lts.yml
          - recipe-gaming.yml

jobs:
  build:
    name: Build image
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.recipe != 'all') && fromJSON(format('["{0}"]', github.event.inputs.recipe)) || fromJSON('["recipe.yml","recipe-lts.yml","recipe-gaming.yml"]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build custom image
        uses: blue-build/github-action@v1.10
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
