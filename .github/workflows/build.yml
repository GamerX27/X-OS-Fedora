name: build
on:
  schedule:
    - cron: "00 17 * * *" # rebuild every day at 5:00 PM UTC to pick up upstream Kinoite/Brave updates
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build image
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build custom image
        uses: blue-build/github-action@v1.10
        with:
          recipe: recipes/${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
