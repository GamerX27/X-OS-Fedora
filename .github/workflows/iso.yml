name: build-iso
on:
  workflow_dispatch:
  schedule:
    - cron: "00 08 * * 0" # weekly, Sunday 08:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install BlueBuild CLI
        run: bash <(curl -s https://raw.githubusercontent.com/blue-build/cli/main/install.sh)

      - name: Generate ISO
        run: |
          sudo bluebuild generate-iso --iso-name kinoite-x27.iso image ghcr.io/gamerx27/kinoite-x27:latest

      - name: Generate checksum
        run: sha256sum kinoite-x27.iso > kinoite-x27.iso.sha256sum

      - name: Publish to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: iso-latest
          name: Latest ISO
          make_latest: true
          body: Rebuilt automatically from `ghcr.io/gamerx27/kinoite-x27:latest`. Always reflects the current `main` branch, not a fixed version.
          files: |
            kinoite-x27.iso
            kinoite-x27.iso.sha256sum
