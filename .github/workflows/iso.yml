name: build-iso
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install BlueBuild CLI
        run: bash <(curl -s https://raw.githubusercontent.com/blue-build/cli/main/install.sh)

      - name: Generate ISO
        run: |
          sudo bluebuild generate-iso --iso-name x-os-fedora.iso image ghcr.io/gamerx27/x-os-fedora:latest

      - name: Generate checksum
        run: sha256sum x-os-fedora.iso > x-os-fedora.iso.sha256sum

      # Not a GitHub Release: the ISO exceeds Releases' 2 GiB per-asset limit. Artifacts
      # have no such cap, at the cost of requiring GitHub login and a 60-day expiry.
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-os-fedora-iso
          path: |
            x-os-fedora.iso
            x-os-fedora.iso.sha256sum
          if-no-files-found: error
          retention-days: 60

      # Public, permanent, no-login mirror. Re-running this uploads over the same
      # archive.org item (identifier stays fixed), so the download link never changes.
      - name: Upload ISO to Internet Archive
        env:
          IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IAS3_ACCESS_KEY" ] || [ -z "$IAS3_SECRET_KEY" ]; then
            echo "IA_ACCESS_KEY/IA_SECRET_KEY not set, skipping Internet Archive upload."
            exit 0
          fi
          pip install --quiet internetarchive
          ia upload x-os-fedora x-os-fedora.iso x-os-fedora.iso.sha256sum \
            --metadata="title:X-OS-Fedora Installer ISO" \
            --metadata="mediatype:software" \
            --metadata="collection:open_source_software" \
            --metadata="description:Custom Fedora Kinoite installer ISO, built with BlueBuild. https://github.com/GamerX27/X-OS-Fedora"
