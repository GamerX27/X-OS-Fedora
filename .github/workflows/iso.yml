name: build-iso
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install BlueBuild CLI
        run: bash <(curl -s https://raw.githubusercontent.com/blue-build/cli/main/install.sh)

      - name: Generate ISO
        run: |
          sudo bluebuild generate-iso --iso-name x-os-fedora.iso image ghcr.io/gamerx27/x-os-fedora:latest

      - name: Generate checksum
        run: sha256sum x-os-fedora.iso > x-os-fedora.iso.sha256sum

      # NOTE: this is not a GitHub Release. The ISO comes out over 2 GiB,
      # GitHub's hard per-asset size limit for Releases - uploading it there
      # fails with "size must be less than 2147483648". A workflow artifact
      # has no such cap, at the cost of requiring GitHub login to download
      # and a 60-day expiry.
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-os-fedora-iso
          path: |
            x-os-fedora.iso
            x-os-fedora.iso.sha256sum
          if-no-files-found: error
          retention-days: 60
