---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x-os-gaming
description: X-OS-Fedora (Gaming) - X-OS-Fedora plus Steam, Faugus, Heroic, RPM Fusion codecs, and RPM Fusion's freeworld Mesa VA-API/Vulkan drivers
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  # Ship system-wide config files (dark theme, Konsole, shell default, NM, rpm-ostreed,
  # default browser - same as recipe.yml) plus the gaming-only overlay (the
  # proton-cachyos-install command at /usr/bin, run manually - see README - and the
  # taskbar launcher pins).
  - type: files
    files:
      - source: system
        destination: /
      - source: gaming
        destination: /

  # This base image is bootc-style, so package changes are made with the dnf
  # module (plain `dnf install`/`dnf remove` in the build container) rather
  # than the rpm-ostree module, which requires a live ostree-booted system.
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      cleanup: true
    install:
      packages:
        - brave-origin
        - fastfetch
        - fish
        - htop
        - nano
        - nvtop
        - papirus-icon-theme
        - pciutils
        - lm_sensors
        - easyeffects
        - distrobox
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - khelpcenter
        - plasma-discover
        - plasma-discover-notifier
        - NetworkManager-config-connectivity-fedora

  - type: default-flatpaks
    notify: true
    system:
      install:
        - org.videolan.VLC

  # topgrade drives updates manually now (system image, flatpaks, etc. in one
  # command) instead of bootc's silent background auto-update - see the
  # systemd module below, which masks bootc-fetch-apply-updates.timer and
  # enables a weekly reminder to run it.
  - type: dnf
    repos:
      copr:
        - lilay/topgrade
      cleanup: true
    install:
      packages:
        - topgrade

  # bootc-fetch-apply-updates.timer is enabled by default on this base image
  # and silently downloads+applies updates in the background; masked here in
  # favor of running `topgrade` manually (it covers the system image via
  # rpm-ostree/bootc as well as flatpaks, so one command replaces the auto
  # timer). topgrade-reminder.timer (files/systemd/user/) nudges the user
  # weekly via a desktop notification - see files/systemd/user/. The classic
  # rpm-ostreed-automatic.timer is already masked on bootc images regardless.
  # /etc/rpm-ostreed.conf still sets AutomaticUpdatePolicy=stage for any
  # manual `rpm-ostree upgrade` runs.
  - type: systemd
    system:
      masked:
        - bootc-fetch-apply-updates.timer
    user:
      enabled:
        - topgrade-reminder.timer

  # CachyOS kernel (BORE scheduler). Requires an x86_64-v3 CPU (any Zen-family
  # AMD, Haswell+ Intel) - confirmed fine for the 5900X/3700X this image
  # targets. sbsigntools/mokutil are here only so you can sign the kernel
  # yourself if Secure Boot is enabled; the kernel itself ships unsigned.
  # https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos/
  # cleanup is deliberately NOT set here (defaults to false): the copr repo
  # must still be enabled for the containerfile module below, which is where
  # kernel-cachyos actually gets installed. Setting cleanup: true disables the
  # repo as soon as THIS module ends, before that later install ever runs -
  # that's exactly what broke the first attempt ("No match for argument:
  # kernel-cachyos"). The repo gets disabled manually at the end of that swap
  # step instead, once the install is actually done.
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos
    install:
      packages:
        - sbsigntools
        - mokutil

  # The swap itself can't be plain dnf install/remove: kernel-cachyos
  # Provides: kernel, so removing "kernel" after installing it would take the
  # new kernel right back out - remove the stock kernel first, then install.
  # tsflags=noscripts skips kernel-cachyos's %posttrans (it runs
  # kernel-install/dracut, which fails in a container build since nothing has
  # run depmod yet); depmod is run manually instead. virtualbox-guest-additions
  # is reinstalled afterward since it Requires: kernel and gets removed as a
  # side effect of removing kernel-core.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && STOCK_KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -n1)" \
            && echo "Removing Fedora kernel ${STOCK_KVER}" \
            && dnf5 -y remove --no-autoremove \
                 kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra \
            && rm -rf "/usr/lib/modules/${STOCK_KVER}" \
            && dnf5 -y install --setopt=tsflags=noscripts \
                 kernel-cachyos kernel-cachyos-devel-matched \
            && dnf5 -y install --skip-unavailable virtualbox-guest-additions \
            && dnf5 -y copr disable bieszczaders/kernel-cachyos \
            && dnf5 clean all \
            && test "$(ls -1 /usr/lib/modules | wc -l)" -eq 1 \
            && KVER="$(ls -1 /usr/lib/modules)" \
            && test -f "/usr/lib/modules/${KVER}/vmlinuz" \
            && depmod -a "${KVER}" \
            && test -f "/usr/lib/modules/${KVER}/modules.dep" \
            && echo "Kernel now: ${KVER}"

  # Regenerates initramfs to pick up the kernel swap above. Must run after it.
  - type: initramfs

  # RPM Fusion + gaming COPRs + gaming packages. A plain `type: dnf` module here (repos +
  # install together, like the base-packages module above) hit a real conflict in CI: Fedora's
  # own `updates` repo now ships a unified `libfdk-aac` (epoch 1) that Obsoletes both
  # `fdk-aac`/`fdk-aac-free`, x86_64-only, and it's already installed on the base image by the
  # time this module runs (it rides in through the base image's own Fedora updates, not
  # through anything this recipe installs). Because Obsoletes isn't arch-scoped, that
  # already-installed 64-bit package blocks installing `fdk-aac`/`fdk-aac-free` for i686 too -
  # and no i686 build of `libfdk-aac` itself exists - so steam.i686's
  # pipewire-alsa(x86-32) -> pipewire-libs(x86-32) -> libfdk-aac.so.2 chain can never resolve
  # ("Failed to resolve the transaction" / "conflicting requests" in CI). A plain
  # `--exclude=libfdk-aac` on the steam install (tried first) doesn't help: libfdk-aac isn't a
  # candidate in that transaction, it's already installed by an earlier layer, so excluding it
  # is a no-op. The actual fix is to swap the already-installed libfdk-aac back out for
  # fdk-aac-free (patent-safe; we don't need proprietary FDK-AAC *encoding* quality here -
  # hardware video codec support already comes from the freeworld Mesa VA-API drivers below)
  # on x86_64, then explicitly add the i686 build, before steam ever gets a chance to pull in
  # pipewire's i686 deps. Since this can recur on every weekly rebuild for as long as Fedora
  # keeps shipping libfdk-aac in updates, the swap is guarded by `rpm -q` (a no-op once/if
  # Fedora stops shipping libfdk-aac by default) rather than being a one-time fixup. `dnf5
  # swap` has no --exclude/--skip-unavailable options, hence the separate guard rather than
  # folding it into the swap call itself. Needs a containerfile RUN instead of the declarative
  # dnf module since that module has no swap/exclude options; COPRs are enabled/disabled by
  # hand here for the same reason.
  # https://copr.fedorainfracloud.org/coprs/atim/heroic-games-launcher/
  # https://copr.fedorainfracloud.org/coprs/faugus/faugus-launcher/
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install \
              https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm \
              https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm \
            && if rpm -q libfdk-aac >/dev/null 2>&1; then dnf5 -y swap libfdk-aac fdk-aac-free; fi \
            && dnf5 -y install --skip-unavailable --exclude=libfdk-aac fdk-aac-free.i686 \
            && dnf5 -y copr enable atim/heroic-games-launcher \
            && dnf5 -y copr enable faugus/faugus-launcher \
            && dnf5 -y install --skip-unavailable --exclude=libfdk-aac \
                 steam steam-devices gamemode gamescope mangohud goverlay \
                 faugus-launcher heroic-games-launcher-bin \
                 mesa-vulkan-drivers mesa-vulkan-drivers.i686 vulkan-loader vulkan-tools amd-gpu-firmware \
            && dnf5 -y copr disable atim/heroic-games-launcher \
            && dnf5 -y copr disable faugus/faugus-launcher

  # RPM Fusion multimedia codecs (ffmpeg swap, @multimedia group). Same libfdk-aac exclusion
  # as above, for the same reason - @multimedia can pull the same nonfree AAC codec.
  #
  # libheif-ffmpeg hits the same already-installed trap as libfdk-aac above (confirmed by a
  # failed CI run that only excluded it): Fedora's `updates` repo already ships
  # libheif-ffmpeg, pinning `libheif` to its newer version, before this module ever runs -
  # so it isn't a candidate in this transaction and `--exclude=libheif-ffmpeg` alone is a
  # no-op. RPM Fusion's libheif-freeworld (the nonfree HEIF/AVIF codec @multimedia pulls in)
  # is hard-pinned to the older libheif version it was built against and hasn't caught up
  # yet, so with libheif-ffmpeg still installed the group install can't swap libheif at all
  # ("Problem: conflicting requests" / "requires libheif.so.1 ... none of the providers can
  # be installed" in CI). Removing libheif-ffmpeg first (guarded by rpm -q, a no-op once/if
  # Fedora stops shipping it by default) clears the way for libheif-freeworld's older,
  # matching libheif to take over; --exclude=libheif-ffmpeg on the group install itself is
  # kept too so nothing pulls it back in during the same transaction.
  #
  # pipewire-codec-aptx is excluded for a genuine (not already-installed) file conflict:
  # Fedora's own pipewire-libs-extra now ships native aptX Bluetooth codec support (same
  # story as libfdk-aac - the aptX patent situation cleared up and Fedora absorbed it
  # directly), and it installs the exact same file
  # (/usr/lib64/spa-0.2/bluez5/libspa-codec-bluez5-aptx.so) that RPM Fusion's separate
  # pipewire-codec-aptx package - still a member of the @multimedia group - also ships.
  # RPM Fusion hasn't added a Conflicts/Obsoletes against the new Fedora package yet, so the
  # transaction fails at the RPM level ("file ... conflicts with file from package
  # pipewire-libs-extra" in CI) rather than at depsolve time. Unlike libfdk-aac/libheif-ffmpeg
  # above, pipewire-codec-aptx is an actual fresh install candidate here (pulled in by the
  # group, not pre-installed by the base image), so a plain --exclude works.
  # https://rpmfusion.org/Howto/Multimedia
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y config-manager setopt fedora-cisco-openh264.enabled=1 \
            && if rpm -q libheif-ffmpeg >/dev/null 2>&1; then dnf5 -y remove --no-autoremove libheif-ffmpeg; fi \
            && dnf5 -y swap ffmpeg-free ffmpeg --allowerasing \
            && dnf5 -y install @multimedia --exclude=libfdk-aac,libheif-ffmpeg,pipewire-codec-aptx,PackageKit-gstreamer-plugin --setopt="install_weak_deps=False"

  # RPM Fusion's freeworld Mesa VA-API/Vulkan drivers (proprietary H.264/HEVC/VC1/AV1
  # hardware codec support Fedora's own Mesa can't ship), 64-bit + i686 - the plain package
  # swap from rpmfusion.org/Howto/Multimedia, not a custom build. (An earlier version of
  # this recipe tried compiling Mesa from source instead; dropped after CI hit
  # Fedora's mesa.spec now needing dynamic Rust/cargo BuildRequires - via
  # %generate_buildrequires - that plain rpmbuild outside mock doesn't resolve. This
  # prebuilt swap is simpler and doesn't have that problem.)
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install mesa-va-drivers-freeworld \
            && dnf5 -y swap mesa-vulkan-drivers mesa-vulkan-drivers-freeworld \
            && dnf5 -y install mesa-va-drivers-freeworld.i686 \
            && dnf5 -y swap mesa-vulkan-drivers.i686 mesa-vulkan-drivers-freeworld.i686 \
            && rpm -q mesa-va-drivers-freeworld mesa-vulkan-drivers-freeworld

  # Defensive assertion (matches this repo's existing style, e.g. the kernel-swap module
  # above) that the desktop-file IDs files/gaming's layout.js just pinned in the taskbar
  # actually exist now that steam/faugus/heroic are installed.
  - type: containerfile
    snippets:
      - |
        RUN test -f /usr/share/applications/steam.desktop \
            && test -f /usr/share/applications/org.kde.konsole.desktop \
            && test -f /usr/share/applications/brave-origin.desktop

  # X-Linuxtool (X27's interactive setup/tooling launcher) installed as a
  # standing command - https://codeberg.org/X27/X-Linuxtool. Its submenu
  # scripts still fetch themselves at runtime, same as its normal
  # curl-pipe-bash usage; this just installs the launcher itself.
  #
  # Brave debranding/hardening policy from the same project, applied here at
  # build time (writes /etc/brave/policies/managed/) since Brave Origin is
  # already installed above and this is a native RPM, not Flatpak, so the
  # script's Flatpak branch is a no-op. Its /etc/hosts telemetry-blocking step
  # is tolerated-but-not-fatal: buildah bind-mounts /etc/hosts read-only
  # during RUN, so that part of the script always fails here regardless of
  # what writes to it (confirmed in CI - "tee: /etc/hosts: Read-only file
  # system"); the policy JSON (the part that actually matters) is verified
  # with an explicit test instead of trusting the script's own exit code.
  #
  # LC_TIME=C.UTF-8: localectl (which talks to systemd over D-Bus) isn't
  # usable during a container build, so this is set directly in
  # /etc/locale.conf instead - preserving LANG/etc if the base image already
  # sets them there, rather than overwriting the whole file.
  #
  # Plymouth pinned explicitly to Fedora's own default boot theme so it can't
  # silently drift from whatever the base image or kernel swap above leaves
  # in place; -R rebuilds the initramfs itself.
  #
  # /etc/os-release PRETTY_NAME/BUILD_ID get the actual build date stamped in
  # directly with `date` here, inside the real build, rather than via
  # BlueBuild's os-release module fed by a placeholder substituted in a
  # workflow step beforehand - blue-build/github-action does its own
  # `actions/checkout` internally before building, which clobbers any
  # uncommitted edits a prior workflow step made to the recipe file, so that
  # approach silently never took effect (confirmed in CI: the built image
  # kept the literal, unsubstituted "$BUILD_DATE" placeholder). Only
  # PRETTY_NAME/BUILD_ID are touched, not ID/ID_LIKE/VERSION_ID, so the image
  # still self-identifies as plain Fedora everywhere that matters (dnf/copr
  # releasever handling upstream of this already happened by this point
  # anyway, since this module runs last). BootLoaderSpec also derives the
  # GRUB boot-menu entry's title from PRETTY_NAME, so this is what fixes that
  # too.
  #
  # fastfetch config pulled from the user's own X27-Fastfetch-Config repo at
  # build time, same pattern as X-Linuxtool/Brave below - future edits there
  # land automatically on the next weekly rebuild.
  - type: containerfile
    snippets:
      - |
        RUN mkdir -p /etc/xdg/fastfetch \
            && curl -fsSL -o /etc/xdg/fastfetch/config.jsonc \
                 https://raw.githubusercontent.com/GamerX27/X27-Fastfetch-Config/main/fastfetch/config.jsonc
      - |
        RUN curl -fsSL -o /usr/bin/x-linuxtool \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/X-Linuxtool.sh \
            && chmod +x /usr/bin/x-linuxtool
      - |
        RUN set -eu; \
            curl -fsSL -o /tmp/make_brave_great_again.sh \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/Desktop/Linux-Desktop/Browser/make_brave_great_again.sh; \
            chmod +x /tmp/make_brave_great_again.sh; \
            /tmp/make_brave_great_again.sh || true; \
            test -f /etc/brave/policies/managed/make_brave_great_again.json; \
            rm -f /tmp/make_brave_great_again.sh
      - |
        RUN if grep -q '^LC_TIME=' /etc/locale.conf 2>/dev/null; then \
              sed -i 's/^LC_TIME=.*/LC_TIME=C.UTF-8/' /etc/locale.conf; \
            else \
              echo 'LC_TIME=C.UTF-8' >> /etc/locale.conf; \
            fi
      - |
        RUN plymouth-set-default-theme -R bgrt
      - |
        RUN BUILD_DATE="$(date -u +%Y-%m-%d)" \
            && sed -i "s|^PRETTY_NAME=.*|PRETTY_NAME=\"Fedora Kinoite (x-os-gaming, build ${BUILD_DATE})\"|" /etc/os-release \
            && echo "BUILD_ID=\"${BUILD_DATE}\"" >> /etc/os-release

  - type: signing
