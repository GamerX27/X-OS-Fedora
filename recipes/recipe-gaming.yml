---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-gaming
description: X27-Linux (Gaming) - X27-Linux plus Steam, Faugus, Heroic, RPM Fusion codecs, and RPM Fusion's freeworld Mesa VA-API/Vulkan drivers
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 44

modules:
  # system config (as recipe.yml) plus the gaming overlay: proton-cachyos-install
  # command at /usr/bin, animations off (etc/xdg/kdeglobals), and the taskbar launcher pins.
  - type: files
    files:
      - source: system
        destination: /
      - source: gaming
        destination: /

  # bootc image: package changes happen via dnf in the build container, not rpm-ostree.
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      cleanup: true
    install:
      packages:
        - brave-origin
        - fastfetch
        - fish
        - htop
        - kitty
        - nano
        - nvtop
        - papirus-icon-theme
        - pciutils
        - lm_sensors
        - easyeffects
        - distrobox
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - khelpcenter
        - konsole
        - plasma-discover
        - plasma-discover-notifier
        - NetworkManager-config-connectivity-fedora

  # Bazaar replaces Discover (removed above).
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - org.videolan.VLC
        - io.github.kolunmi.Bazaar

  - type: dnf
    repos:
      copr:
        - lilay/topgrade
      cleanup: true
    install:
      packages:
        - topgrade

  # Masks the base image's background auto-update timer; topgrade-reminder.timer
  # (files/systemd/user/) nudges weekly instead. x27-install-date.service
  # (files/systemd/system/) stamps /var/lib/x27-linux/install-date on first boot only,
  # for fastfetch's OS Age - /var persists across updates, unlike /etc or /usr.
  - type: systemd
    system:
      enabled:
        - x27-install-date.service
      masked:
        - bootc-fetch-apply-updates.timer
    user:
      enabled:
        - topgrade-reminder.timer

  # CachyOS kernel (BORE scheduler), needs an x86_64-v3 CPU. cleanup: false is deliberate:
  # the copr must stay enabled for the containerfile install below, then gets disabled there.
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos
    install:
      packages:
        - sbsigntools
        - mokutil

  # kernel-cachyos Provides: kernel, so the stock kernel is removed first (installing the
  # new one first would remove it right back out). noscripts skips the RPM's post-install
  # kernel-install/dracut hook, which fails before depmod has run - depmod runs manually below.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && STOCK_KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -n1)" \
            && echo "Removing Fedora kernel ${STOCK_KVER}" \
            && dnf5 -y remove --no-autoremove \
                 kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra \
            && rm -rf "/usr/lib/modules/${STOCK_KVER}" \
            && dnf5 -y install --setopt=tsflags=noscripts \
                 kernel-cachyos kernel-cachyos-devel-matched \
            && dnf5 -y install --skip-unavailable virtualbox-guest-additions \
            && dnf5 -y copr disable bieszczaders/kernel-cachyos \
            && dnf5 clean all \
            && test "$(ls -1 /usr/lib/modules | wc -l)" -eq 1 \
            && KVER="$(ls -1 /usr/lib/modules)" \
            && test -f "/usr/lib/modules/${KVER}/vmlinuz" \
            && depmod -a "${KVER}" \
            && test -f "/usr/lib/modules/${KVER}/modules.dep" \
            && echo "Kernel now: ${KVER}"

  # CachyOS userspace tuning from bieszczaders/kernel-cachyos-addons: cachyos-settings (sysctl,
  # zram, udev, ntsync) and the sched-ext schedulers. cachyos-settings Conflicts with
  # zram-generator-defaults, hence the swap. Before initramfs: it adds modprobe.d/udev rules.
  # Gaming also gets ananicy-cpp and scx-manager, with scx_loader (scx_lavd, files/gaming/etc/scx_loader)
  # and ananicy-cpp enabled here, since the systemd module above runs before they're installed.
  # power-profiles-daemon replaces tuned-ppd for powerprofilesctl, which game-performance needs.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y copr enable bieszczaders/kernel-cachyos-addons \
            && dnf5 -y swap zram-generator-defaults cachyos-settings \
            && dnf5 -y install scx-scheds scx-tools \
                 ananicy-cpp cachyos-ananicy-rules scx-manager \
            && dnf5 -y copr disable bieszczaders/kernel-cachyos-addons \
            && dnf5 -y swap tuned-ppd power-profiles-daemon \
            && rpm -q cachyos-settings scx-scheds scx-tools ananicy-cpp cachyos-ananicy-rules scx-manager \
            && command -v powerprofilesctl \
            && systemctl enable scx_loader.service ananicy-cpp.service power-profiles-daemon.service

  # Regenerates initramfs to pick up the kernel swap above. Must run after it.
  - type: initramfs

  # Fedora's own updates repo ships a unified libfdk-aac (Obsoletes fdk-aac/fdk-aac-free,
  # x86_64 only) that's already installed before this module runs, blocking the i686
  # fdk-aac-free build steam.i686 needs (pipewire-alsa -> libfdk-aac.so.2 chain). Swap the
  # installed package for the patent-safe fdk-aac-free first, then add the i686 build
  # explicitly, before steam can pull in pipewire's i686 deps. Guarded by `rpm -q` so it's
  # a no-op once Fedora stops shipping libfdk-aac by default. Needs a containerfile RUN
  # since the declarative dnf module has no swap/exclude support.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install \
              https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm \
              https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm \
            && if rpm -q libfdk-aac >/dev/null 2>&1; then dnf5 -y swap libfdk-aac fdk-aac-free; fi \
            && dnf5 -y install --skip-unavailable --exclude=libfdk-aac fdk-aac-free.i686 \
            && dnf5 -y copr enable faugus/faugus-launcher \
            && dnf5 -y install --skip-unavailable --exclude=libfdk-aac \
                 steam steam-devices gamemode gamescope mangohud goverlay \
                 faugus-launcher \
                 mesa-vulkan-drivers mesa-vulkan-drivers.i686 vulkan-loader vulkan-tools amd-gpu-firmware \
            && dnf5 -y copr disable faugus/faugus-launcher

  # Heroic from its GitHub releases (the atim COPR stopped updating), checked against the sha512
  # in latest-linux.yml. The RPM installs to /opt, which is /var/opt on bootc and never updated
  # after first install, so it's moved to /usr/lib/heroic.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && BASE=https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases/latest/download \
            && curl -fsSL -o /tmp/heroic.yml "$BASE/latest-linux.yml" \
            && VER="$(sed -n 's/^version: //p' /tmp/heroic.yml)" \
            && RPM="Heroic-${VER}-linux-x86_64.rpm" \
            && SHA="$(grep -A1 "url: ${RPM}" /tmp/heroic.yml | sed -n 's/.*sha512: //p')" \
            && curl -fsSL -o "/tmp/${RPM}" "$BASE/${RPM}" \
            && test "$(openssl dgst -sha512 -binary "/tmp/${RPM}" | base64 -w0)" = "$SHA" \
            && OPT_LINK="$(readlink /opt || true)" \
            && if [ -n "$OPT_LINK" ]; then rm /opt && mkdir /opt; fi \
            && dnf5 -y install "/tmp/${RPM}" \
            && mv /opt/Heroic /usr/lib/heroic \
            && if [ -n "$OPT_LINK" ]; then rmdir /opt && ln -s "$OPT_LINK" /opt; fi \
            && { update-alternatives --remove-all heroic 2>/dev/null || true; } \
            && ln -sf /usr/lib/heroic/heroic /usr/bin/heroic \
            && sed -i 's|/opt/Heroic|/usr/lib/heroic|g' /usr/share/applications/heroic.desktop \
            && rm -f /tmp/heroic.yml "/tmp/${RPM}" \
            && test -x "$(readlink -f /usr/bin/heroic)" \
            && grep -q '^Exec=/usr/lib/heroic/heroic' /usr/share/applications/heroic.desktop \
            && echo "Heroic ${VER}"

  # libheif-ffmpeg (already installed via Fedora's updates repo) pins libheif to a version
  # newer than RPM Fusion's libheif-freeworld supports, blocking the @multimedia group's
  # libheif swap - removed first, guarded by `rpm -q` so it's a no-op once Fedora stops
  # shipping it. pipewire-codec-aptx conflicts at the file level with Fedora's own
  # pipewire-libs-extra (same .so path) - excluded from the group install.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y config-manager setopt fedora-cisco-openh264.enabled=1 \
            && if rpm -q libheif-ffmpeg >/dev/null 2>&1; then dnf5 -y remove --no-autoremove libheif-ffmpeg; fi \
            && dnf5 -y swap ffmpeg-free ffmpeg --allowerasing \
            && dnf5 -y install @multimedia --exclude=libfdk-aac,libheif-ffmpeg,pipewire-codec-aptx,PackageKit-gstreamer-plugin --setopt="install_weak_deps=False"

  # Prebuilt RPM Fusion swap, not a from-source Mesa build - that hit Fedora's mesa.spec
  # needing dynamic Rust/cargo BuildRequires that plain rpmbuild outside mock can't resolve.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install mesa-va-drivers-freeworld \
            && dnf5 -y swap mesa-vulkan-drivers mesa-vulkan-drivers-freeworld \
            && dnf5 -y install mesa-va-drivers-freeworld.i686 \
            && dnf5 -y swap mesa-vulkan-drivers.i686 mesa-vulkan-drivers-freeworld.i686 \
            && rpm -q mesa-va-drivers-freeworld mesa-vulkan-drivers-freeworld

  # Sanity check: files/gaming's layout.js pins these desktop files in the taskbar.
  - type: containerfile
    snippets:
      - |
        RUN test -f /usr/share/applications/steam.desktop \
            && test -f /usr/share/applications/org.kde.dolphin.desktop \
            && test -f /usr/share/applications/kitty.desktop \
            && test -f /usr/share/applications/brave-origin.desktop

  # make_brave_great_again.sh's /etc/hosts step always fails here (buildah bind-mounts it
  # read-only during RUN) and is ignored; the policy file it writes is verified explicitly instead.
  - type: containerfile
    snippets:
      - |
        RUN curl -fsSL -o /usr/bin/x-linuxtool \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/X-Linuxtool.sh \
            && chmod +x /usr/bin/x-linuxtool
      - |
        RUN set -eu; \
            curl -fsSL -o /tmp/make_brave_great_again.sh \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/Desktop/Linux-Desktop/Browser/make_brave_great_again.sh; \
            chmod +x /tmp/make_brave_great_again.sh; \
            /tmp/make_brave_great_again.sh || true; \
            test -f /etc/brave/policies/managed/make_brave_great_again.json; \
            rm -f /tmp/make_brave_great_again.sh
      # localectl normally talks to systemd-localed over D-Bus; whether that's reachable
      # in this build step (no PID 1 systemd) is unverified here, so the sed/echo fallback
      # below (the previous approach) only fires if set_locale_time doesn't take.
      - |
        RUN info() { echo "[INFO] $*"; }; \
            ok()   { echo "[OK] $*"; }; \
            warn() { echo "[WARN] $*"; }; \
            err()  { echo "[ERR] $*"; }; \
            set_locale_time() { \
                info "Attempting to set LC_TIME to C.UTF-8..."; \
                if ! locales=$(localectl list-locales 2>/dev/null); then \
                    err "localectl is not available."; \
                    return 1; \
                fi; \
                if echo "$locales" | grep -q "C.UTF-8"; then \
                    if localectl set-locale LC_TIME=C.UTF-8; then \
                        ok "Successfully set LC_TIME."; \
                    else \
                        err "Failed to set the locale time."; \
                        return 1; \
                    fi; \
                else \
                    warn "C.UTF-8 locale not available. Skipping."; \
                fi; \
            }; \
            set_locale_time || { \
                if grep -q '^LC_TIME=' /etc/locale.conf 2>/dev/null; then \
                    sed -i 's/^LC_TIME=.*/LC_TIME=C.UTF-8/' /etc/locale.conf; \
                else \
                    echo 'LC_TIME=C.UTF-8' >> /etc/locale.conf; \
                fi; \
            }
      - |
        RUN plymouth-set-default-theme -R bgrt
      # VARIANT stays Kinoite: topgrade uses it to pick rpm-ostree over dnf.
      # Set directly here, not via BlueBuild's os-release module: a value substituted into
      # the recipe by an earlier workflow step doesn't survive blue-build's own checkout
      # right before the build starts.
      - |
        RUN set -eu \
            && BUILD_DATE="$(date -u +%Y-%m-%d)" \
            && . /etc/os-release \
            && sed -i --follow-symlinks -e '/^NAME=/d' -e '/^PRETTY_NAME=/d' -e '/^BUILD_ID=/d' /etc/os-release \
            && printf 'NAME="X27-Linux"\nPRETTY_NAME="X27-Linux %s Gaming (%s)"\nBUILD_ID="%s-%s"\n' \
                 "${VERSION_ID}" "${BUILD_DATE}" "${VERSION_ID}" "${BUILD_DATE}" >> /etc/os-release \
            && grep -qx 'VARIANT="Kinoite"' /etc/os-release

  # Last step: all dnf5 calls above are done. See files/system/usr/libexec/x27-dnf-guard.
  - type: containerfile
    snippets:
      - |
        RUN mv /usr/bin/dnf5 /usr/libexec/dnf5-real \
            && ln -s /usr/libexec/x27-dnf-guard /usr/bin/dnf5 \
            && test "$(readlink -f /usr/bin/dnf)" = /usr/libexec/x27-dnf-guard \
            && dnf5 --version

  - type: signing
